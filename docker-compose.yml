# The whole site as it will run on the hotel's hosting: PHP + MySQL, with a mail catcher.
#   npm run assemble && docker compose up -d --build
#   site http://127.0.0.1:8788/   dashboard http://127.0.0.1:8788/admin/   caught emails http://127.0.0.1:8026/
services:
  web:
    build: server
    ports: ["127.0.0.1:8788:80"]
    volumes:
      - ./deploy:/var/www/html
      - ./server/config.docker.php:/etc/rr-config.php:ro
    environment:
      RR_CONFIG: /etc/rr-config.php
    depends_on: [db, mail]
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: regency
      MARIADB_USER: regency
      MARIADB_PASSWORD: regency
      MARIADB_ROOT_PASSWORD: root
    volumes: [dbdata:/var/lib/mysql]
  mail:
    image: axllent/mailpit
    ports: ["127.0.0.1:8026:8025"]
volumes:
  dbdata:
