<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Regency Royal Sharm · Dashboard</title>
<style>
  :root { --cobalt: #1553b6; --navy: #10203f; --ink: #1b2a4a; --muted: #5b6b8a; --line: #d5dfef; --bg: #f3f6fb; --white: #fff; --yellow: #ffd23f; --red: #b3261e; --green: #13753a; }
  * { box-sizing: border-box; }
  html { font-family: system-ui, 'Segoe UI', Tahoma, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  body { margin: 0; line-height: 1.55; }
  h1, h2, h3 { margin: 0; color: var(--navy); }
  h2 { font-size: 1.25rem; margin-bottom: 14px; }
  h3 { font-size: 1.05rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 2px solid var(--line); border-radius: 0; background: var(--white); min-height: 42px; }
  input[type=checkbox] { width: 20px; min-height: 20px; height: 20px; padding: 0; }
  input[type=file] { border-style: dashed; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  label.check { flex-direction: row; align-items: center; gap: 8px; }
  .btn { display: inline-block; background: var(--cobalt); color: var(--white); border: 2px solid var(--navy); padding: 9px 18px; font-weight: 700; cursor: pointer; text-decoration: none; min-height: 42px; }
  .btn.ghost { background: var(--white); color: var(--navy); }
  .btn.danger { background: var(--white); color: var(--red); border-color: var(--red); }
  .btn.ok { background: var(--green); }
  .btn.small { padding: 4px 10px; min-height: 34px; font-size: 0.9rem; }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .hdr { background: var(--cobalt); color: var(--white); border-bottom: 4px solid var(--navy); }
  .hdr-in, .main { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .hdr-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; }
  .hdr h1 { color: var(--white); font-size: 1.15rem; margin-inline-end: auto; }
  .hdr .btn { background: transparent; color: var(--white); border-color: var(--white); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .tabs button { background: transparent; color: var(--white); border: 0; border-bottom: 4px solid transparent; padding: 10px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected=true] { background: var(--bg); color: var(--navy); }
  .main { padding-block: 22px 80px; }
  .card { background: var(--white); border: 2px solid var(--navy); box-shadow: 5px 5px 0 var(--navy); padding: 16px; margin-bottom: 20px; }
  .grid { display: grid; gap: 12px; }
  @media (min-width: 720px) { .grid.c2 { grid-template-columns: 1fr 1fr; } .grid.c3 { grid-template-columns: repeat(3, 1fr); } .grid.c5 { grid-template-columns: repeat(5, 1fr); } }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chips button { background: var(--white); border: 2px solid var(--navy); padding: 6px 14px; font-weight: 700; cursor: pointer; }
  .chips button[aria-pressed=true] { background: var(--navy); color: var(--white); }
  .badge { display: inline-block; padding: 2px 10px; font-weight: 700; font-size: 0.85rem; border: 2px solid currentColor; }
  .badge.pending { background: var(--yellow); color: var(--navy); border-color: var(--navy); }
  .badge.confirmed, .badge.paid { color: var(--green); }
  .badge.declined, .badge.cancelled { color: var(--red); }
  .req-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .req-head b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.1rem; color: var(--navy); }
  .req-head time { color: var(--muted); font-size: 0.88rem; margin-inline-start: auto; }
  dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 16px; margin: 0 0 12px; }
  dl.facts dt { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  dl.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .note { background: var(--bg); border-inline-start: 4px solid var(--cobalt); padding: 8px 12px; margin: 0 0 12px; white-space: pre-wrap; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 12px; }
  .thumb { border: 2px solid var(--line); padding: 8px; background: var(--white); display: grid; gap: 6px; }
  .thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .thumb input:not([type=checkbox]) { min-height: 34px; padding: 5px 8px; font-size: 0.9rem; }
  .logo-box { max-width: 260px; max-height: 110px; background: repeating-conic-gradient(#e8edf6 0 25%, #fff 0 50%) 0 0 / 18px 18px; border: 2px solid var(--line); padding: 8px; }
  .login { max-width: 400px; margin: 9vh auto; padding: 0 16px; }
  .toast { position: fixed; inset-inline: 16px; bottom: 16px; max-width: 520px; margin: 0 auto; padding: 12px 16px; font-weight: 700; color: var(--white); background: var(--green); border: 2px solid var(--navy); z-index: 9; }
  .toast.bad { background: var(--red); }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  td, th { text-align: start; padding: 5px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .text-row { display: grid; gap: 8px; padding: 12px 0; border-bottom: 2px dashed var(--line); }
  .text-row code { font-size: 0.8rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
